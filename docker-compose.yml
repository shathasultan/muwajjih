services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: intent-service:local
    ports:
      - "8000:8000"
    environment:
      INTENT_LOG_LEVEL: INFO
      INTENT_CONFIDENCE_FLOOR: "0.15"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
