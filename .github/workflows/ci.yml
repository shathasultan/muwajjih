name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: static analysis. Fastest feedback, so it runs first and blocks
  # everything else -- no point training a model to find out the code does
  # not lint.
  # -------------------------------------------------------------------------
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,train]"

      - name: Ruff (lint)
        run: ruff check src tests train

      - name: Ruff (format check)
        run: ruff format --check src tests train

      - name: Mypy (static types, strict)
        run: mypy src

      - name: pip-audit (known vulnerabilities in dependencies)
        run: |
          pip install pip-audit
          pip-audit --strict

  # -------------------------------------------------------------------------
  # Stage 2: train the model from source, then run all three test layers.
  # Training happens in CI (not a committed binary) because the dataset
  # generator is seeded -- so CI re-proves reproducibility on every push.
  # -------------------------------------------------------------------------
  test:
    name: Train & test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,train]"

      - name: Generate dataset (deterministic, seed=42)
        run: python -m train.generate_dataset

      - name: Train model
        run: python -m train.train_model

      - name: Unit tests
        env:
          INTENT_API_KEYS: ci-test-key
        run: pytest tests/unit -v

      - name: Integration tests
        env:
          INTENT_API_KEYS: ci-test-key
        run: pytest tests/integration -v

      - name: Behavioural tests (model quality gates)
        env:
          INTENT_API_KEYS: ci-test-key
        run: pytest tests/behavioural -v -m behavioural

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent-model
          path: |
            models/intent_model.joblib
            models/metrics.json

  # -------------------------------------------------------------------------
  # Stage 3: build the container and smoke-test the running service. This is
  # the gate that catches "works on my machine" -- a green unit suite means
  # nothing if the image does not start and answer a real HTTP request.
  # -------------------------------------------------------------------------
  docker:
    name: Build image & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t intent-service:ci .

      - name: Run container
        run: |
          docker run -d --name intent-ci -p 8000:8000 \
            -e INTENT_API_KEYS=ci-smoke-key intent-service:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/v1/ready | grep -q '"ready":true'; then
              echo "service healthy"; exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy in time"
          docker logs intent-ci
          exit 1

      - name: Smoke-test /predict
        run: |
          response=$(curl -sf -X POST http://127.0.0.1:8000/v1/predict \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: ci-smoke-key' \
            -d '{"text":"وصلني المنتج تالف ومكسور"}')
          echo "$response"
          echo "$response" | grep -q '"intent":"complaint"'

      - name: Verify unauthenticated requests are rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/v1/predict \
            -H 'Content-Type: application/json' -d '{"text":"test"}')
          echo "unauthenticated -> $code"
          [ "$code" = "401" ]

      - name: Container logs on failure
        if: failure()
        run: docker logs intent-ci

      - name: Cleanup
        if: always()
        run: docker rm -f intent-ci || true

  # -------------------------------------------------------------------------
  # Stage 4: deploy. Only runs for pushes to main that already passed every
  # gate above -- a pull request builds and smoke-tests the image but never
  # publishes it. This is the CD half of "CI/CD".
  # -------------------------------------------------------------------------
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Every image is traceable to the exact commit that produced it.
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
