name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Useful for re-running the pipeline against a branch without
  # pushing a no-op commit, and as a way back in if an event is ever missed.
  workflow_dispatch:

# Cancel superseded runs on the same branch: a force-push while CI is running
# otherwise burns a runner proving something about a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 0: the FAST GATE. Everything a developer can break in a one-line
  # change, answered inside a minute, before a runner is spent on training a
  # model. `timeout-minutes: 2` is the enforcement: if this job ever creeps past
  # its budget, CI fails and somebody has to fix the gate rather than quietly
  # accept a slower feedback loop.
  # ---------------------------------------------------------------------------
  gate:
    name: Fast gate (< 60s)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,train]"

      - name: Lint, type-check, architecture contract, train, unit + integration
        run: |
          start=$(date +%s)
          # Training is INSIDE the measured window, not a setup step before it.
          # The integration suite exercises the real artifact, a fresh runner
          # has none, and excluding the 3s that produces it would be measuring
          # a gate nobody actually runs. There is headroom either way.
          python -m train.generate_dataset
          python -m train.train_model
          ruff check src tests train scripts
          ruff format --check src tests train scripts
          mypy src
          lint-imports
          python -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" \
            .github/workflows/ci.yml docker-compose.yml \
            .pre-commit-config.yaml .github/dependabot.yml
          pytest tests/unit tests/integration -q --no-header
          elapsed=$(( $(date +%s) - start ))
          echo "fast gate finished in ${elapsed}s (budget: 60s)"
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::fast gate exceeded its 60s budget"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Stage 1: secrets. Scans the FULL history, not just the diff -- a key removed
  # in a later commit is still a leaked key, and `git log -p` still serves it.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks needs every commit, not a shallow clone

      # The binary directly, not gitleaks-action. The action scans only the
      # commit RANGE of the push that triggered it, which is not what this job
      # claims to do -- and on the first push to a fresh repository that range
      # is `<root-commit>^..HEAD`, which git rejects because a root commit has
      # no parent. `detect --source .` walks every commit instead, so the job
      # does what its name says and does not depend on how it was triggered.
      #
      # Pinned to an exact version: a scanner that silently changes its rule
      # set between runs makes a green result meaningless.
      - name: gitleaks (every commit)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  # ---------------------------------------------------------------------------
  # Stage 2: dependency vulnerabilities. Separate from the fast gate because it
  # reaches the network and its runtime is not ours to control.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,train]"

      - name: pip-audit (known vulnerabilities in dependencies)
        # Audited against a frozen list rather than the live environment.
        #
        # `pip-audit --strict` on the environment fails on ANY package it
        # cannot look up -- including intent-service itself, which is
        # installed editable and has no PyPI release. `--skip-editable` does
        # not help: --strict counts a skip as a failure too. Freezing with
        # --exclude-editable drops exactly one package, our own, and keeps
        # --strict meaningful for all 70+ third-party dependencies, which is
        # what this job exists to check.
        run: |
          pip freeze --exclude-editable > /tmp/requirements-audit.txt
          echo "auditing $(wc -l < /tmp/requirements-audit.txt) dependencies"
          pip-audit --strict -r /tmp/requirements-audit.txt

  # ---------------------------------------------------------------------------
  # Stage 3: train the model from source, then run all three test layers with
  # the branch-coverage gate. Training happens in CI (not a committed binary)
  # because the dataset generator is seeded -- so CI re-proves reproducibility
  # on every push.
  # ---------------------------------------------------------------------------
  test:
    name: Train & full test pyramid
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,train]"

      - name: Train from source (deterministic, seed=42)
        run: |
          python -m train.generate_dataset
          python -m train.train_model

      - name: Reproducibility -- a second run must produce the same dataset
        run: |
          sha_before=$(cat data/*.csv | sha256sum)
          python -m train.generate_dataset
          sha_after=$(cat data/*.csv | sha256sum)
          if [ "$sha_before" != "$sha_after" ]; then
            echo "::error::the seeded generator is not deterministic"
            exit 1
          fi
          echo "dataset is byte-identical across runs"

      - name: Unit tests
        run: pytest tests/unit -q --no-header

      - name: Integration tests
        run: pytest tests/integration -q --no-header

      - name: Behavioural tests (invariance, directional, golden, quality)
        run: pytest tests/behavioural -q --no-header -m behavioural

      - name: Branch-coverage gate (>= 80%)
        run: pytest tests -q --no-header --cov --cov-report=term-missing

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent-model
          path: |
            models/intent_model.joblib
            models/metrics.json

  # ---------------------------------------------------------------------------
  # Stage 4: build the container and smoke-test the running service. This is the
  # gate that catches "works on my machine": a green unit suite means nothing if
  # the image does not start and answer a real HTTP request.
  # ---------------------------------------------------------------------------
  image:
    name: Build image, check size & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t intent-service:ci .

      - name: Enforce the 500 MB image budget
        run: |
          bytes=$(docker image inspect intent-service:ci --format '{{.Size}}')
          mb=$(( bytes / 1000000 ))
          echo "image size: ${mb} MB (budget: 500 MB)"
          echo "IMAGE_SIZE_MB=${mb}" >> "$GITHUB_ENV"
          if [ "$mb" -gt 500 ]; then
            echo "::error::image is ${mb} MB, over the 500 MB budget"
            exit 1
          fi

      - name: Smoke test the running container
        run: ./scripts/smoke.sh intent-service:ci 8000 ci-smoke-key

      - name: Compose stack comes up healthy, gated on Redis
        env:
          INTENT_API_KEYS: ci-compose-key
        run: |
          docker compose up -d --wait
          curl -sf http://127.0.0.1:8000/v1/ready | grep -q '"cache_backend":"redis"'
          curl -sf -X POST http://127.0.0.1:8000/v1/predict \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-compose-key' \
            -d '{"text":"وين طلبي؟ صار له اسبوع"}' | grep -q '"department":"logistics"'
          docker compose down -v

      - name: Record the measured size in the job summary
        run: |
          echo "Image size: **${IMAGE_SIZE_MB} MB** / 500 MB budget" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage 5: publish. Only for pushes to main that passed every gate above -- a
  # pull request builds and smoke-tests the image but never publishes it. This
  # is the CD half of "CI/CD".
  #
  # NOTE: there is deliberately NO `latest` tag. `latest` is mutable: two
  # deployments of "latest" a week apart are different software with no record
  # of which is running, and a rollback has nothing to roll back to. Every image
  # is addressed by its commit SHA, and only by its commit SHA.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [image, secrets, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Required before the build below. The runner's default builder uses the
      # `docker` driver, which cannot export a build cache -- `cache-to:
      # type=gha` fails outright against it. This action provisions a
      # `docker-container` driver builder, which can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the published digest
        run: |
          {
            echo "Published \`ghcr.io/${{ github.repository }}:${{ github.sha }}\`"
            echo ""
            echo "Deploy by SHA. There is no \`latest\` tag by design."
          } >> "$GITHUB_STEP_SUMMARY"
