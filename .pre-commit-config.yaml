# Runs the same gates CI runs, but before the commit lands -- so a red CI
# run becomes the exception rather than the normal feedback loop.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.8.0
          - pydantic-settings>=2.4.0
          - fastapi>=0.115.0
          - numpy>=1.26.0
          - types-redis

  # Catch a secret before it reaches the history, not after. The CI job scans
  # the full history as a backstop, but by then a leaked key needs rotating --
  # this hook is what stops it being committed at all.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # The architecture contract, enforced locally as well as in CI. A layering
  # violation caught here costs a minute; caught in review it costs a rewrite.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture contract)
        entry: lint-imports
        language: system
        pass_filenames: false
        files: ^src/
