[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-service"
version = "1.0.0"
description = "Arabic customer-message intent classifier, served as a containerised REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.4.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
train = ["pandas>=3.0.6"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pandas>=3.0.6",
    "import-linter>=2.0",
    "pip-audit>=2.7.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ship the marker so anything importing this package gets its types.
[tool.setuptools.package-data]
intent_service = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "behavioural: model-quality tests that need the trained artifact",
]
# No --cov here. Coverage is applied by `make test` (the full gate) but NOT by
# `make gate` (the fast one): instrumenting every line roughly doubles the
# suite's wall time, and the fast gate's whole purpose is to stay under 60s.

[tool.coverage.run]
branch = true
source = ["src/intent_service"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# Branch coverage, not line coverage: the requirement is >= 80% on the core
# layers, and a policy made of if/elif branches can hit 100% of lines while
# leaving whole decision paths untested. Branch coverage is what actually
# proves the human_review and reject bands are exercised.
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "train", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4"]
ignore = [
    # This service classifies Arabic text, so Arabic literals and comments are
    # the subject matter, not a homoglyph attack. RUF001/002/003 flag every
    # Arabic character as "ambiguous with a Latin lookalike", which here is
    # hundreds of false positives and zero true ones.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
packages = ["intent_service"]
strict = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*", "pandas"]
ignore_missing_imports = true
